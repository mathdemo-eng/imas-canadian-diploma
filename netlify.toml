# Netlify hosting settings. Netlify reads this file automatically.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Each chapter has its own page file (e.g. pathways.html for /pathways). Every other address
# (the admin panel, the Student Portal) loads the plain app page, which shows the right screen.
[[redirects]]
  from = "/*"
  to = "/shell.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
